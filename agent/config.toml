# Jarvis configuration. Tune behavior here, not in code.
# Secrets (API keys) do NOT go here — put them in .env (see .env.example).

[assistant]
name = "Jarvis"
wake_phrase = "Hey Jarvis"
purpose = "help me with my research and studies: learning, keeping track of what I'm working on, and finding things out"
personality = "Warm, plain-spoken, and brief. Explain clearly, like a patient tutor. Say so when you don't know."

[model]
# Model id for the brain. Change it here to swap models.
name = "claude-opus-5-5"
# How hard the model thinks: low | medium | high | xhigh | max.
# Lower is faster and cheaper; research questions benefit from medium or higher.
effort = "medium"
max_tokens = 16000
# Seconds to wait on the API before giving up on a turn.
timeout_seconds = 60
# If the model declines a request, let the API retry it on a fallback model.
fallbacks = true

[tools]
# Where notes and tasks are stored (relative to this folder). Plain JSON you can open and edit.
data_dir = "data"
# Maximum rounds of tool calls in one turn before Jarvis gives up instead of looping.
max_rounds = 8

[debug]
# Tools listed here fail on purpose, to check that Jarvis explains failures instead of crashing.
# Example: fail_tools = ["list_tasks"]
fail_tools = []

[voice]
# Voice mode: python -m jarvis --voice. API keys go in .env, not here.
# "hold": hold ptt_key while speaking. "enter": press Enter to start, Enter to stop.
ptt_mode = "hold"
# A pynput key name ("space", "ctrl_r", "alt_r", "f8", ...) or a single character.
ptt_key = "space"
# Short beeps when the mic opens and closes.
earcons = true
# Speech-to-text (Deepgram)
stt_model = "nova-3"
language = "en"
# Text-to-speech (ElevenLabs). Chosen voice: https://elevenlabs.io/voices/wDsJlOXPqcvIUKdLXjDs
elevenlabs_voice_id = "wDsJlOXPqcvIUKdLXjDs"
# Flash is ElevenLabs' lowest-latency model; latency is the whole voice experience.
tts_model = "eleven_flash_v2_5"
